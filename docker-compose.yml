# The Django application only. PostgreSQL runs on the host machine; create
# its database and user first (docs/deploy-auth-service.md).

services:

  auth:
    build:
      context: .
      dockerfile: dockerfile
    image: jivo-auth:latest
    container_name: jivo_auth
    # Share the host's network: the app reaches the host's PostgreSQL at
    # 127.0.0.1:5432 (set POSTGRES_HOST=127.0.0.1), which then stays closed
    # to the network, and gunicorn listens on 127.0.0.1:8000 for Nginx on
    # the same machine.
    network_mode: host
    env_file:
      - .env
    environment:
      GUNICORN_BIND: ${GUNICORN_BIND:-127.0.0.1:8000}
      # The signing key is mounted as a secret, never baked into the image.
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    # A mounted secret keeps its file permissions, so run as a user who can
    # read the key: APP_UID/APP_GID in .env (the key owner's `id -u`/`id -g`),
    # or the image's own user 10001 after `sudo chown 10001 jwt_private.pem`.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    secrets:
      - jwt_private_key
    restart: unless-stopped
    # Docker's default json-file driver never rotates; cap the logs at 50 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


secrets:
  jwt_private_key:
    # Generate with:
    #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt_private.pem
    file: ./jwt_private.pem
