{% load support_tags %}
{# icon_name, optional message, heading and tone ("good"). #}
<div class="empty{% if tone %} empty--{{ tone }}{% endif %}">
  <span class="empty__icon">{% icon icon_name|default:"inbox" 22 %}</span>
  {% if heading %}<h2>{{ heading }}</h2>{% endif %}
  {% if message %}<p>{{ message }}</p>{% endif %}
</div>
