<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Jivo account{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --border: #d6dae2;
      --accent: #1f6feb;
      --error-bg: #fdecec;
      --error-text: #a3161b;
      --ok-bg: #e8f6ec;
      --ok-text: #1a6b34;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1d2129;
        --text: #e6e9ef;
        --muted: #a2aab8;
        --border: #343a46;
        --accent: #58a6ff;
        --error-bg: #3b1d1f;
        --error-text: #ff9ea2;
        --ok-bg: #173323;
        --ok-text: #8fdca8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 16px; color: var(--muted); }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
    input[type=password], input[type=email] {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 11px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .notice { margin: 16px 0 0; padding: 12px; border-radius: 8px; }
    .notice ul { margin: 0; padding-left: 18px; }
    .error { background: var(--error-bg); color: var(--error-text); }
    .ok { background: var(--ok-bg); color: var(--ok-text); }
    .hint { margin-top: 12px; font-size: 13px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
